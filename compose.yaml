services:
  api:
    build:
      context: .
    container_name: shopping-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_PORT: "5433"
      POSTGRES_HOST: "db"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: shopping-db
    env_file:
      - .env
    environment:
      POSTGRES_PORT: "5433"
      POSTGRES_HOST: "db"
    # Make Postgres actually LISTEN on 5433 (the image ignores POSTGRES_PORT on its own)
    command: -p 5433
    ports:
      - "5433:5433"
    volumes:
      - shopping-db-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready must also target 5433
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopping-db-data: